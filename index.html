<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangout options for 22nd Nov 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #1d1f24;
    --wall-2: #2a2d34;
    --chalk: #f2efe6;
    --pink: #ff3d81;
    --cyan: #19d3e6;
    --yellow: #ffd23f;
    --lime: #9bff3a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 10%, #2b2f38 0, transparent 45%),
      var(--wall);
    color: var(--chalk);
    font-family: "Rubik", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 420px; padding: 36px 0 40px; text-align: center; }

  h1 {
    font-family: "Permanent Marker", cursive;
    font-weight: 400;
    font-size: clamp(30px, 9vw, 40px);
    line-height: 1.1;
    margin: 0 0 14px;
    transform: rotate(-2deg);
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--pink);
  }
  .sub { margin: 0 0 28px; font-size: 17px; opacity: .85; }

  .cards { display: flex; flex-direction: column; gap: 22px; align-items: center; }

  .card { width: 100%; max-width: 300px; height: 170px; perspective: 900px; cursor: pointer;
          background: none; border: 0; padding: 0; font: inherit; color: inherit; }
  .card:focus-visible { outline: 3px solid var(--cyan); outline-offset: 6px; border-radius: 22px; }
  .inner { position: relative; width: 100%; height: 100%;
           transition: transform .7s cubic-bezier(.3,1.3,.5,1); transform-style: preserve-3d; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card.dimmed { opacity: .35; pointer-events: none; transition: opacity .4s; }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    padding: 18px; font-size: 20px; font-weight: 500; line-height: 1.35;
  }
  .front { font-family: "Permanent Marker", cursive; font-size: 34px; background: var(--wall-2);
           border: 3px solid var(--chalk); box-shadow: 6px 6px 0 var(--pink); }
  .card:nth-child(2) .front { box-shadow: 6px 6px 0 var(--cyan); }
  .back { transform: rotateY(180deg); color: #15161a; background: var(--yellow);
          border: 3px solid var(--chalk); box-shadow: 6px 6px 0 var(--pink); }
  .card:nth-child(2) .back { background: var(--lime); box-shadow: 6px 6px 0 var(--cyan); }

  #go {
    margin-top: 34px; display: none;
    font-family: "Permanent Marker", cursive; font-size: 26px;
    color: #15161a; background: var(--pink); border: 3px solid var(--chalk);
    border-radius: 999px; padding: 12px 38px; cursor: pointer;
    box-shadow: 5px 5px 0 var(--cyan);
  }
  #go.show { display: inline-block; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
  #go:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--cyan); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* graffiti overlay */
  #wall { position: fixed; inset: 0; z-index: 10; display: none; background: rgba(29,31,36,.92); }
  #wall.on { display: block; }
  #spray { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tag {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%) rotate(-6deg);
    font-family: "Permanent Marker", cursive; font-size: clamp(64px, 22vw, 110px);
    color: var(--chalk); white-space: nowrap; letter-spacing: 2px;
    text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--cyan);
    clip-path: inset(0 100% 0 0);
  }
  #tag.reveal { animation: wipe .9s steps(18) forwards; }
  @keyframes wipe { to { clip-path: inset(-20% -10% -80% -10%); } }
  .drip { position: absolute; width: 7px; border-radius: 0 0 6px 6px; height: 0;
          animation: drip 1.6s ease-in forwards; }
  @keyframes drip { to { height: var(--h); } }
  #close { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); width: 100%;
           text-align: center; font-size: 14px; opacity: 0; transition: opacity .6s 2.4s; }
  #wall.on #close { opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
    #tag.reveal { animation-duration: .01s; }
  }
</style>
</head>
<body>
<main>
  <h1>Hangout options for 20th March 2025</h1>
  <p class="sub">Hello Sakshi, please choose an option.</p>

  <div class="cards">
    <button class="card" data-i="0" aria-label="Option A">
      <div class="inner">
        <div class="face front">Option A</div>
        <div class="face back" id="ans0"></div>
      </div>
    </button>
    <button class="card" data-i="1" aria-label="Option B">
      <div class="inner">
        <div class="face front">Option B</div>
        <div class="face back" id="ans1"></div>
      </div>
    </button>
  </div>

  <button id="go">Lessgo</button>
</main>

<div id="wall" aria-hidden="true">
  <canvas id="spray"></canvas>
  <div id="tag">LESSGO!</div>
  <div id="close">tap anywhere to close</div>
</div>

<script>
  // ✏️ EDIT YOUR ANSWERS HERE
  const ANSWERS = [
    "Karting at Raftaar followed by Dinner",
    "Karting at Phase 3 followed by Metro ride"
  ];

  const cards = document.querySelectorAll(".card");
  const go = document.getElementById("go");
  ANSWERS.forEach((a, i) => (document.getElementById("ans" + i).textContent = a));

  cards.forEach(card => card.addEventListener("click", () => {
    if (document.querySelector(".card.flipped")) return;   // one choice only
    card.classList.add("flipped");
    cards.forEach(c => { if (c !== card) c.classList.add("dimmed"); });
    setTimeout(() => go.classList.add("show"), 600);
  }));

  // ---------- graffiti ----------
  const wall = document.getElementById("wall");
  const canvas = document.getElementById("spray");
  const ctx = canvas.getContext("2d");
  const tag = document.getElementById("tag");
  const COLORS = ["#ff3d81", "#19d3e6", "#ffd23f", "#9bff3a", "#f2efe6"];
  let raf, timer;

  function startGraffiti() {
    const dpr = window.devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    wall.querySelectorAll(".drip").forEach(d => d.remove());
    tag.classList.remove("reveal"); void tag.offsetWidth;
    wall.classList.add("on");

    const heads = COLORS.slice(0, 4).map(c => ({
      x: Math.random() * W, y: Math.random() * H,
      a: Math.random() * Math.PI * 2, c, r: 5 + Math.random() * 6
    }));
    const t0 = performance.now();

    (function frame(now) {
      const t = now - t0;
      if (t < 2400) {
        heads.forEach(h => {
          h.a += (Math.random() - .5) * .55;
          for (let s = 0; s < 3; s++) {          // 3 sub-steps per frame
            h.x += Math.cos(h.a) * 4; h.y += Math.sin(h.a) * 4;
            if (h.x < 0 || h.x > W) h.a = Math.PI - h.a;
            if (h.y < 0 || h.y > H) h.a = -h.a;
            ctx.fillStyle = h.c;
            for (let i = 0; i < 14; i++) {         // spray dots
              const ang = Math.random() * 6.283, d = Math.random() * h.r * 2.2;
              ctx.globalAlpha = .35 + Math.random() * .5;
              ctx.fillRect(h.x + Math.cos(ang) * d, h.y + Math.sin(ang) * d, 1.6, 1.6);
            }
          }
        });
        raf = requestAnimationFrame(frame);
      }
    })(t0);

    timer = setTimeout(() => {
      tag.classList.add("reveal");
      setTimeout(addDrips, 800);
    }, 900);
  }

  function addDrips() {
    const r = tag.getBoundingClientRect();
    for (let i = 0; i < 7; i++) {
      const d = document.createElement("div");
      d.className = "drip";
      d.style.left = r.left + r.width * (0.08 + Math.random() * 0.84) + "px";
      d.style.top = r.top + r.height * 0.78 + "px";
      d.style.background = i % 2 ? "#ff3d81" : "#19d3e6";
      d.style.setProperty("--h", 30 + Math.random() * 90 + "px");
      d.style.animationDelay = Math.random() * .5 + "s";
      wall.appendChild(d);
    }
  }

  go.addEventListener("click", startGraffiti);
  wall.addEventListener("click", () => {
    cancelAnimationFrame(raf); clearTimeout(timer);
    wall.classList.remove("on");
  });
</script>
</body>
</html>
